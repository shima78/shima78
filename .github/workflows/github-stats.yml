# Regenerates assets/stats.svg from the GitHub API once a day and commits it
# if it changed. No personal access token or third-party service required —
# the built-in GITHUB_TOKEN can read the public data the card shows.
#
# Run it on demand from the Actions tab ("Run workflow") any time.

name: GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-stats.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain assets/stats.svg)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/stats.svg
            git commit -m "chore: refresh GitHub stats card"
            git push
          else
            echo "No change."
          fi
